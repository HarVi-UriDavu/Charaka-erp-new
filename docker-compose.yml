services:
  erp:
    build: .
    container_name: charaka-erp
    restart: unless-stopped
    ports:
      - "4173:4173"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    environment:
      - PORT=4173
      - DATABASE_URL=postgresql://charaka:${POSTGRES_PASSWORD:-charaka-dev-password}@postgres:5432/charaka
      - WHATSAPP_RELAY_URL=${WHATSAPP_RELAY_URL:-}
      - WHATSAPP_RELAY_TOKEN=${WHATSAPP_RELAY_TOKEN:-}
      - WHATSAPP_SYNC_INTERVAL_MS=${WHATSAPP_SYNC_INTERVAL_MS:-30000}
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_name: charaka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: charaka
      POSTGRES_USER: charaka
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-charaka-dev-password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  postgres-data:
